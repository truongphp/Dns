name: Locket Gold Activator
on:
  workflow_dispatch:
    inputs:
      username:
        description: 'Nhập Link hoặc Username Locket (ví dụ: locket.cam/xyz)'
        required: true

jobs:
  active:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Tool
        env:
          FETCH_TOKEN: ${{ secrets.FETCH_TOKEN }}
          APP_TRANSACTION: ${{ secrets.APP_TRANSACTION }}
        run: python main.py "${{ github.event.inputs.username }}"
